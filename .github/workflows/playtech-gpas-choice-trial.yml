name: GPAS choice serializer trial
on:
  push:
    branches: [fix/verify-partials-20261023]
    paths:
      - .github/workflows/playtech-gpas-choice-trial.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pick:
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[playtech]'
      - name: One fresh extra2 demo bonus with source and server guarded pick
        run: python scripts/playtech-gpas-choice-trial.py
