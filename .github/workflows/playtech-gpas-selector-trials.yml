name: GPAS isolated selector and bankroll trials
on:
  push:
    branches: [fix/verify-partials-20261023]
    paths:
      - .github/workflows/playtech-gpas-selector-trials.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: cash
            cases: 'gpas_cashrl_pop,DOLLAR-250,DOLLAR-250 gpas_cashrl_pop,DOLLAR-500,DOLLAR-500'
          - group: selector
            cases: 'gpas_gporang_pop,20,default gpas_aogggriffin_pop,20,default'
          - group: emeralds
            cases: 'gpas_eemeraldspp_pop,1,default gpas_eemeraldspp_pop,10,10'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[playtech]'
      - name: Probe each fresh official demo once only
        shell: bash
        env:
          TRIAL_CASES: ${{ matrix.cases }}
        run: |
          read -ra cases <<< "$TRIAL_CASES"
          python scripts/playtech-gpas-selector-trials.py --cases "${cases[@]}"
