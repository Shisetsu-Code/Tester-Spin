name: GPAS isolated selector and bankroll trials
on:
  push:
    branches: [fix/verify-partials-20261023]
    paths:
      - .github/workflows/playtech-gpas-selector-trials.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: cash
            cases: 'gpas_cashrl_pop,DOLLAR-250,default gpas_cashrl_pop,DOLLAR-500,default'
          - group: selector
            cases: 'gpas_gporang_pop,40,default gpas_gporang_pop,100,default gpas_gporang_pop,40,40'
          - group: emeralds
            cases: 'gpas_eemeraldspp_pop,1,lines-1 gpas_eemeraldspp_pop,5,lines-5 gpas_eemeraldspp_pop,10,lines-10'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[playtech]'
      - name: Probe each fresh official demo once only
        shell: bash
        env:
          TRIAL_CASES: ${{ matrix.cases }}
        run: |
          read -ra cases <<< "$TRIAL_CASES"
          python scripts/playtech-gpas-selector-trials.py --cases "${cases[@]}"
