name: GPAS original ZIP unknown-mode discriminator
on:
  push:
    branches: [fix/verify-partials-20261023]
    paths:
      - .github/workflows/playtech-original-unbound-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: 'line-ladder'
            cases: 'gpas_gstorm2_pop,1,lines-5 gpas_gstorm2_pop,2,lines-10 gpas_gstorm2_pop,4,lines-20'
          - group: 'line-standard'
            cases: 'gpas_agstorm3_pop,25,lines-25 gpas_dostormspp_pop,5,lines-5 gpas_dostormspp_pop,BasePP,lines-25'
          - group: 'shop-and-rr'
            cases: 'gpas_krluprising_pop,ShopFeature1,ShopFeature1 gpas_krluprising_pop,ShopFeature4,ShopFeature4 gpas_krsqueen_pop,600,600'
          - group: 'specials'
            cases: 'gpas_gotabyss_pop,6TB,6TB gpas_aogggriffin_pop,HR10,HR10 gpas_goalmsnjp_pop,3x3_1_bomb,3x3_1_bomb'
          - group: 'ante-selector'
            cases: 'gpas_aogwfot_pop,Extra,extra gpas_aogwfot_pop,Extra,Extra gpas_aogwfot_pop,Extra,default'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TESTER_SPIN_PUBLISH_RESULTS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[playtech]'
      - name: One fresh demo request per declared mode, no retries
        shell: bash
        env:
          CASES: ${{ matrix.cases }}
        run: |
          read -ra arr <<< "$CASES"
          python scripts/playtech-gpas-declared-probe.py "${arr[@]}"
