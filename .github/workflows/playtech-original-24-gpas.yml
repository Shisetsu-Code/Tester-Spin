name: Playtech 24 original GPAS modes full verification
run-name: Original 24 GPAS · final current-contract audit
on:
  push:
    branches: [fix/verify-partials-20261023]
    paths:
      - .github/workflows/playtech-original-24-gpas.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - group: '1'
            games: 'gpas_aogggriffin_pop gpas_gstorm2_pop gpas_agstorm3_pop gpas_mgaogkol_pop'
          - group: '2'
            games: 'gpas_aogww_pop gpas_aogwfot_pop gpas_cashrl_pop gpas_coft_pop'
          - group: '3'
            games: 'gpas_crylo_pop gpas_dostormspp_pop gpas_eemeraldspp_pop gpas_scqueen_pop'
          - group: '4'
            games: 'gpas_squeen_pop gpas_fluffyf_pop gpas_jokjac_pop gpas_goalmsnjp_pop'
          - group: '5'
            games: 'gpas_wcupcc_pop gpas_gporang_pop gpas_gotzon_pop gpas_krluprising_pop'
          - group: '6'
            games: 'gpas_krsqueen_pop gpas_gotabyss_pop gpas_lluckmcc_pop gpas_lluckmccpp_pop'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TESTER_SPIN_PUBLISH_RESULTS: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[playtech]'
      - name: Execute all live declared GPAS modes (no historical replay)
        shell: bash
        env:
          GAMES: ${{ matrix.games }}
        run: |
          set +e
          read -ra codes <<< "$GAMES"
          python scripts/playtech-actions-sample.py \
            --games "${codes[@]}" --spins 1 --timeout 40 --wall-timeout 130 \
            --data-root "$RUNNER_TEMP/playtech-original-24" \
            --output-dir safe-results
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('safe-results/summary.json')
          if p.is_file():
            vals=json.loads(p.read_text())['results']
            print('GPAS_ORIGINAL_24_RESULTS',json.dumps([{
              'code':x.get('symbol'),'status':x.get('status'),
              'rounds':x.get('successful_spins',0),
              'issues':x.get('execution_issues',[])[:16],
            } for x in vals],ensure_ascii=False))
          PY
          exit 0
      - name: Save redacted summary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-gpas24-${{ matrix.group }}
          path: safe-results/
          retention-days: 7
          if-no-files-found: warn
