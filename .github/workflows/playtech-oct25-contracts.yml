name: Playtech Oct25 fresh contract inspection
on:
  push:
    branches: [fix/verify-partials-20261023]
    paths:
      - .github/workflows/playtech-oct25-contracts.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      TESTER_SPIN_PUBLISH_RESULTS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[playtech]'
      - name: Observe only current game config and client mode bindings
        run: |
          python scripts/playtech-gpas-contract-inspect.py \
            gpas_wlroll_pop gpas_sorome_pop gpas_mwilds_pop \
            gpas_efnof_pop gpas_dncftnt_pop gpas_wcupcc_pop