name: Playtech original mixed Standard line family
on:
  push:
    branches: [fix/verify-partials-20261023]
    paths:
      - .github/workflows/playtech-original-mixed-lines.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TESTER_SPIN_PUBLISH_RESULTS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[playtech]'
      - name: Revalidate all original mixed-line and conventional line modes
        shell: bash
        run: |
          set +e
          python scripts/playtech-actions-sample.py \
            --games gpas_gstorm2_pop gpas_eemeraldspp_pop \
            --spins 1 --timeout 35 --wall-timeout 100 \
            --data-root "$RUNNER_TEMP/mixed-standard-lines" \
            --output-dir demo-result
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('demo-result/summary.json')
          if p.exists():
            for r in json.loads(p.read_text())['results']:
              print('MIXED_LINE_RESULT',json.dumps({'code':r['symbol'],
                    'status':r['status'],'rounds':r['successful_spins'],
                    'issues':r['execution_issues']},ensure_ascii=False))
          PY
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-mixed-line-results
          path: demo-result/
          if-no-files-found: warn
          retention-days: 7
