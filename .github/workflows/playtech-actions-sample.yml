name: Playtech demo sample
run-name: Playtech · 5 demos · verified continuation evidence

on:
  workflow_dispatch:
  push:
    branches: [actions/playtech-sample-20261018]
    paths:
      - .github/workflows/playtech-actions-sample.yml
      - scripts/playtech-actions-sample.py
      - tester_spin/providers/playtech/**
      - tester_spin/run_tree.py
      - tests/test_run_tree.py

permissions:
  contents: read

concurrency:
  group: tester-spin-provider-execution
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONUTF8: '1'
      TESTER_SPIN_PUBLISH_RESULTS: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install Playtech and Chromium
        run: |
          python -m pip install '.[playtech]'
          python -m playwright install --with-deps chromium
      - name: Run five official demo games sequentially
        run: |
          python scripts/playtech-actions-sample.py \
            --games aogmt ashabw ashhof ashadv gpas_bbt_pop \
            --spins 2 --timeout 45 --wall-timeout 240 \
            --data-root "$RUNNER_TEMP/playtech-sample-data" \
            --output-dir action-diagnostics
      - name: Upload sanitized game diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playtech-sample-${{ github.run_id }}
          path: action-diagnostics/
          if-no-files-found: warn
          retention-days: 14
