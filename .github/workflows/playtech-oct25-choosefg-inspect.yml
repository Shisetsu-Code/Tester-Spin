name: Playtech ChooseFG source-only contract inspection
on:
  push:
    branches: [fix/verify-partials-20261023]
    paths:
      - .github/workflows/playtech-oct25-choosefg-inspect.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[playtech]'
      - name: Extract only bounded source expressions, no wagers
        run: python scripts/playtech-oct25-choosefg-inspect.py
