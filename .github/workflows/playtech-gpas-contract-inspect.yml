name: GPAS fresh contract evidence
on:
  push:
    branches: [fix/verify-partials-20261023]
    paths:
      - .github/workflows/playtech-gpas-contract-inspect.yml
      - scripts/playtech-gpas-contract-inspect.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GPAS direct demo bootstrap
        run: python -m pip install '.[playtech]'
      - name: Inspect only declared runtime contracts, no wagers
        run: |
          python scripts/playtech-gpas-contract-inspect.py \
            gpas_cashrl_pop gpas_gporang_pop gpas_aogggriffin_pop \
            gpas_lluckmccpp_pop gpas_jdice_pop gpas_mgaogkol_pop \
            gpas_eemeraldspp_pop gpas_jokjac_pop
