name: Playtech original NGM splash verification
on:
  push:
    branches: [fix/verify-partials-20261023]
    paths:
      - .github/workflows/playtech-original-ngm-splash.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo:
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: 'splash'
            games: 'aogroo fdtsl dvncvnoptpp'
          - group: 'control'
            games: 'aogmt bt'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TESTER_SPIN_PUBLISH_RESULTS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install '.[playtech]'
          python -m playwright install --with-deps chromium
      - name: Verify actual screenshot/iframe popup close before paid rounds
        shell: bash
        env:
          GAME_CODES: ${{ matrix.games }}
        run: |
          set +e
          read -ra codes <<< "$GAME_CODES"
          python scripts/playtech-actions-sample.py \
            --games "${codes[@]}" --spins 1 --timeout 40 --wall-timeout 110 \
            --data-root "$RUNNER_TEMP/original-ngm-splash" \
            --output-dir safe-output
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('safe-output/summary.json')
          if p.exists():
            print('NGM_SPLASH_RESULTS',json.dumps([{
              'code':r.get('symbol'),'status':r.get('status'),
              'spins':r.get('successful_spins'),
              'issues':r.get('execution_issues',[])[:8]
            } for r in json.loads(p.read_text())['results']],ensure_ascii=False))
          PY
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-ngm-${{ matrix.group }}
          path: safe-output/
          if-no-files-found: warn
          retention-days: 7
