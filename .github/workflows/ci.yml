name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth
      - name: Compile
        run: python -m compileall -q tester_spin tests run.py launcher.py provider_launcher.py run_standalone.py
      - name: All regression and integration tests
        run: xvfb-run -a python -m pytest tests -q
